# bands.conf - receive windows per band and mode (edit freely)
#
# Columns:  band  mode  center[Hz]  samplerate[Hz]  range[kHz]  exclude[kHz]
#   range    = only this part is evaluated (SKIM_RANGE_KHZ)
#   exclude  = comma-separated digimode windows that are left out (SKIM_EXCLUDE_KHZ), "-" = none
#
# The HF+ passband is flat to about +-62 kHz around the center at 192 kS/s and to about
# -136..+140 kHz at 384 kS/s (measured with one unit; yours may differ slightly).
# A window that floods the decoder with SSB or digimode signals makes OpenSkimmer run out of
# channels ("signal tracker is FULL"), so the ranges below deliberately cover CW segments.
#
# All band edges are from memory (IARU Region 1 band plan, WSJT-X default frequencies):
# please check them against the current lists and adapt them to your region.
# If a "contest" entry is missing, the "normal" entry is used.

# --- normal: CW segment only --------------------------------------------------
160m  normal   1860000   192000   1800-1840        -
80m   normal   3560000   192000   3500-3570        -
40m   normal   7030000   192000   7000-7060        -
30m   normal   10125000  192000   10100-10130      -
20m   normal   14040000  192000   14000-14070      -
17m   normal   18118000  192000   18068-18095      -
15m   normal   21040000  192000   21000-21070      -
12m   normal   24940000  192000   24890-24915      -
10m   normal   28040000  192000   28000-28070      -
2m    normal   144075000 192000   144000-144150    -

# --- contest: CW plus a bit more, without the usual digimode windows ----------
# 160 m and 80 m from the band edge (in CQ WW the CW stations spread far into the SSB part),
# therefore 384 kS/s.
160m  contest  1940000   384000   1800-2000        1838-1843
80m   contest  3640000   384000   3500-3780        3573-3582
40m   contest  7050000   192000   7000-7100        7047-7051.5,7074-7082
30m   contest  10125000  192000   10100-10150      10130-10144
20m   contest  14050000  192000   14000-14100      14070-14073,14074-14086
17m   contest  18118000  192000   18068-18110      18100-18108
15m   contest  21075000  384000   21000-21150      21074-21082,21140-21144
12m   contest  24940000  192000   24890-24930      24915-24926
10m   contest  28065000  384000   28000-28125      28074-28082
2m    contest  144075000 192000   144000-144150    -
